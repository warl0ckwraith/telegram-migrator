[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-migrator"
version = "1.0.0"
description = "Archive and transfer Telegram chats/channels."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
dependencies = [
  "telethon>=1.24.0",
  "rich>=13.0.0",
  "aiosqlite>=0.19.0",
  "cryptg>=0.4.0",
]


[project.scripts]
telegram-migrator = "main:run"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = [
  "main",
  "config",
  "client_manager",
  "channel_resolver",
  "download_engine",
  "transfer_engine",
  "progress_tracker",
  "size_estimator",
  "state_manager",
  "utils",
]
